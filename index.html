<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart E-Commerce Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">

            <!-- ===== SIDEBAR ===== -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="brand">
                    <i class="fas fa-store-alt"></i> SmartShop
                </div>
                <div class="nav flex-column">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-th-large"></i> Dashboard
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-box"></i> Products
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-shopping-cart"></i> Orders
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-users"></i> Customers
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                </div>
            </nav>

            <!-- ===== MAIN CONTENT ===== -->
            <main class="col-md-10 ms-sm-auto px-md-4 main-content">

                <!-- Top Navbar -->
                <div class="top-navbar">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5>
                            <i class="fas fa-th-large me-2 text-primary"></i> Dashboard
                        </h5>
                        <div>
                            <i class="fas fa-moon theme-toggle" onclick="toggleTheme()"></i>
                            <i class="fas fa-bell ms-3"></i>
                            <span class="ms-3">👤 Admin</span>
                        </div>
                    </div>
                    <hr>
                </div>

                <!-- Welcome -->
                <h4>Welcome back, Admin! 👋</h4>
                <p class="text-muted">Here's what's happening with your store today.</p>

                <!-- Stat Cards -->
                <div class="row g-4 mt-2">
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon purple">
                                <i class="fas fa-dollar-sign"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number">$24,560</div>
                                <div class="stat-label">Total Sales</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon blue">
                                <i class="fas fa-shopping-bag"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number">8</div>
                                <div class="stat-label">Total Orders</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon green">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number">6</div>
                                <div class="stat-label">Total Customers</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-icon orange">
                                <i class="fas fa-boxes"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number">8</div>
                                <div class="stat-label">Total Products</div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
