<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShop - Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ================================================================ -->
    <!-- SIDEBAR -->
    <!-- ================================================================ -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fas fa-store-alt"></i> SmartShop
        </div>

        <div class="nav-links">
            <a href="#" class="nav-link active">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-box"></i> Products
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-shopping-cart"></i> Orders
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="#" class="nav-link">
                <i class="fas fa-cog"></i> Settings
            </a>
        </div>

        <!-- Profile Section -->
        <div class="sidebar-footer">
            <div class="profile-info">
                <div class="profile-avatar">H</div>
                <div>
                    <div class="profile-name">Hafsa Shahzad</div>
                    <div class="profile-role">Administrator</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ================================================================ -->
    <!-- MAIN CONTENT -->
    <!-- ================================================================ -->
    <main class="main-content">

        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="page-title">
                <i class="fas fa-th-large"></i> Dashboard
            </div>
            <div class="nav-icons">
                <i class="fas fa-moon" onclick="toggleTheme()"></i>
                <i class="fas fa-bell"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>

        <!-- Welcome Section - FIXED -->
        <div class="welcome-section">
            <h1>Welcome back, Admin! <span>🥳</span></h1>
            <p>Here's what's happening with your store today.</p>
        </div>

        <!-- Stat Cards -->
        <div class="row g-4">
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-icon purple">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number">$24,560</div>
                        <div class="stat-label">Total Sales</div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number">8</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number">6</div>
                        <div class="stat-label">Total Customers</div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="stat-icon orange">
                        <i class="fas fa-boxes"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number">8</div>
                        <div class="stat-label">Total Products</div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
